version: "2"
linters:
  default: standard
  enable:
    - gocyclo
    - goconst
  settings:
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 3
  exclusions:
    rules:
      - path: _test\.go
        linters: [goconst, gocyclo]
formatters:
  enable:
    - gofmt
    - goimports
